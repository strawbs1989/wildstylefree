<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wildstyle Community - MSN Chat</title>
  
  <!-- Supabase & DOMPurify CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0d0f1a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    /* Main Container with Mobile App Aspect Ratio */
    .app-container {
      width: 100%;
      max-width: 410px;
      height: 92vh;
      max-height: 820px;
      background: linear-gradient(180deg, #1d1838 0%, #121324 50%, #0d1e36 100%);
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* ---------------- 1. LOGIN SCREEN ---------------- */
    #login-screen {
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
    }
    .brand-logo {
      width: 70px;
      height: 70px;
      background: #7c3aed;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4);
    }
    .brand-title { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
    .brand-subtitle { font-size: 13px; color: #a1a1aa; margin-bottom: 24px; }

    .form-group { width: 100%; text-align: left; margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #e4e4e7; }
    .form-input {
      width: 100%;
      padding: 14px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .form-input:focus { border-color: #00d2ff; }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #7c3aed 0%, #00d2ff 100%);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
    }
    .toggle-auth { font-size: 13px; color: #a1a1aa; margin-top: 16px; cursor: pointer; }
    .toggle-auth span { color: #00d2ff; font-weight: 600; }
    #auth-error { color: #ef4444; font-size: 12px; margin-top: 10px; }

    /* ---------------- 2. LOBBY / CHAT SCREEN ---------------- */
    #chat-screen {
      display: none;
      flex-direction: column;
      height: 100%;
    }
    .chat-header {
      padding: 16px;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-info { display: flex; align-items: center; gap: 10px; }
    .header-title { font-weight: 700; font-size: 15px; }
    .header-sub { font-size: 11px; color: #a1a1aa; }
    .status-badge {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .status-dot { width: 6px; height: 6px; background: #22c55e; border-radius: 50%; }

    /* Message Cards Stream */
    #messages-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 12px 14px;
      position: relative;
    }
    .msg-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .avatar {
      width: 32px;
      height: 32px;
      background: #3b82f6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
    }
    .user-name { font-weight: 700; font-size: 13px; color: #38bdf8; }
    .role-badge {
      background: #8b5cf6;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 10px;
      text-transform: uppercase;
    }
    .msg-body { font-size: 14px; color: #f4f4f5; line-height: 1.4; word-break: break-word; }
    .msg-time { font-size: 10px; color: #71717a; margin-top: 6px; }

    /* MSN Styling Bar & Floating Input Row */
    .chat-footer {
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.4);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msn-toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .msn-toolbar select {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: none;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
    }
    .msn-toolbar input[type="color"] {
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      background: transparent;
    }

    .input-wrapper { display: flex; gap: 8px; align-items: center; }
    .chat-input {
      flex: 1;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .send-btn {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
    }
  </style>
</head>
<body>

<div class="app-container">
  
  <!-- 1. LOGIN / SIGNUP VIEW -->
  <div id="login-screen">
    <div class="brand-logo">🦊</div>
    <div class="brand-title">Wildstyle Community</div>
    <div class="brand-subtitle">Sign in to chat with DJs and listeners.</div>

    <div class="form-group">
      <label for="auth-user">Username</label>
      <input type="text" id="auth-user" class="form-input" placeholder="e.g. EchoFalls" maxlength="20" />
    </div>

    <div class="form-group">
      <label for="auth-pass">Password</label>
      <input type="password" id="auth-pass" class="form-input" placeholder="Password" />
    </div>

    <button id="submit-btn" class="btn-submit">Login</button>
    
    <div class="toggle-auth" id="toggle-auth-mode">
      Don't have an account? <span id="mode-text">Create one</span>
    </div>
    <div id="auth-error"></div>
  </div>

  <!-- 2. MAIN CHAT / LOBBY VIEW -->
  <div id="chat-screen">
    <div class="chat-header">
      <div class="header-info">
        <div class="avatar" style="background: #8b5cf6;">🦊</div>
        <div>
          <div class="header-title">Wildstyle Community</div>
          <div class="header-sub">Live Community Chat</div>
        </div>
      </div>
      <div class="status-badge">
        <div class="status-dot"></div> Online
      </div>
    </div>

    <!-- Live Stream Cards -->
    <div id="messages-list"></div>

    <!-- Bottom Input & MSN Font Style Bar -->
    <div class="chat-footer">
      <div class="msn-toolbar">
        <select id="font-family">
          <option value="Segoe UI">Segoe UI</option>
          <option value="Comic Sans MS">Comic Sans</option>
          <option value="Impact">Impact</option>
          <option value="Arial">Arial</option>
        </select>
        <input type="color" id="font-color" value="#38bdf8" />
      </div>

      <div class="input-wrapper">
        <input type="text" id="message-input" class="chat-input" placeholder="Type your message..." maxlength="250" />
        <button id="send-btn" class="send-btn">➤</button>
      </div>
    </div>
  </div>

</div>

<script>
  // ===============================================================
  // PASTE YOUR SUPABASE KEYS BELOW (PROJECT SETTINGS -> API)
  // ===============================================================
  const SUPABASE_URL = "https://YOUR-PROJECT-REF.supabase.co";
  const SUPABASE_ANON_KEY = "YOUR-SUPABASE-ANON-KEY";

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  
  let loggedInUser = "";
  let isSignUpMode = false;

  // Toggle Login vs Register Mode
  document.getElementById('toggle-auth-mode').onclick = () => {
    isSignUpMode = !isSignUpMode;
    document.getElementById('submit-btn').innerText = isSignUpMode ? "Register" : "Login";
    document.getElementById('mode-text').innerText = isSignUpMode ? "Sign in" : "Create one";
  };

  // Auth Submission
  document.getElementById('submit-btn').onclick = async () => {
    const user = document.getElementById('auth-user').value.trim();
    const pass = document.getElementById('auth-pass').value.trim();
    const errDiv = document.getElementById('auth-error');
    errDiv.innerText = "";

    if (!user || !pass) return errDiv.innerText = "Please enter username and password.";

    if (isSignUpMode) {
      const { error } = await db.from('users').insert([{ username: user, password: pass }]);
      if (error) {
        errDiv.innerText = "Username taken or failed to register.";
      } else {
        errDiv.style.color = "#22c55e";
        errDiv.innerText = "Account created! You can now log in.";
        isSignUpMode = false;
        document.getElementById('submit-btn').innerText = "Login";
      }
    } else {
      const { data, error } = await db.from('users').select('*').eq('username', user).eq('password', pass);
      if (error || !data || data.length === 0) {
        errDiv.style.color = "#ef4444";
        errDiv.innerText = "Invalid credentials.";
      } else {
        loggedInUser = user;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';
        loadMessages();
        subscribeRealtime();
      }
    }
  };

  // Load Past Messages
  async function loadMessages() {
    const { data } = await db.from('messages').select('*').order('id', { ascending: true }).limit(50);
    if (data) data.forEach(msg => renderCard(msg));
  }

  // Live Subscription
  function subscribeRealtime() {
    db.channel('public:messages')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
        renderCard(payload.new);
      })
      .subscribe();
  }

  // Render Card in Chat
  function renderCard(msg) {
    const list = document.getElementById('messages-list');
    const cleanUser = DOMPurify.sanitize(msg.username);
    
    // Sanitize wildstyle MSN HTML font & color tags
    const cleanBody = DOMPurify.sanitize(msg.formatted_text, {
      ALLOWED_TAGS: ['span', 'b', 'i', 'u', 'font'],
      ALLOWED_ATTR: ['style', 'color']
    });

    const card = document.createElement('div');
    card.className = 'msg-card';
    card.innerHTML = `
      <div class="msg-header">
        <div class="avatar">${cleanUser.charAt(0).toUpperCase()}</div>
        <div class="user-name">${cleanUser}</div>
        <div class="role-badge">Member</div>
      </div>
      <div class="msg-body">${cleanBody}</div>
    `;

    list.appendChild(card);
    list.scrollTop = list.scrollHeight;
  }

  // Send Message
  async function sendMessage() {
    const input = document.getElementById('message-input');
    const text = input.value.trim();
    if (!text || !loggedInUser) return;

    const font = document.getElementById('font-family').value;
    const color = document.getElementById('font-color').value;
    const payload = `<span style="font-family: '${font}'; color: ${color};">${text}</span>`;

    input.value = '';

    await db.from('messages').insert([
      { username: loggedInUser, formatted_text: payload }
    ]);
  }

  document.getElementById('send-btn').onclick = sendMessage;
  document.getElementById('message-input').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });
</script>

</body>
</html>
