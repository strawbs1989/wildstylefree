<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wildstyle Community - MSN Chat</title>

  <!-- Supabase & DOMPurify CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0d0f1a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .app-container {
      width: 100%;
      max-width: 410px;
      height: 92vh;
      max-height: 820px;
      background: linear-gradient(180deg, #1d1838 0%, #121324 50%, #0d1e36 100%);
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* 1. LOGIN SCREEN */
    #login-screen {
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
    }
    .brand-logo {
      width: 70px;
      height: 70px;
      background: #7c3aed;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4);
    }
    .brand-title { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
    .brand-subtitle { font-size: 13px; color: #a1a1aa; margin-bottom: 24px; }

    .form-group { width: 100%; text-align: left; margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #e4e4e7; }
    .form-input {
      width: 100%;
      padding: 14px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .form-input:focus { border-color: #00d2ff; }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #7c3aed 0%, #00d2ff 100%);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
    }
    .toggle-auth { font-size: 13px; color: #a1a1aa; margin-top: 16px; cursor: pointer; }
    .toggle-auth span { color: #00d2ff; font-weight: 600; }
    #auth-error { color: #ef4444; font-size: 12px; margin-top: 10px; }

    /* 2. CHAT SCREEN */
    #chat-screen {
      display: none;
      flex-direction: column;
      height: 100%;
    }
    .chat-header {
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-info { display: flex; align-items: center; gap: 10px; }
    .header-title { font-weight: 700; font-size: 14px; }
    .header-sub { font-size: 11px; color: #a1a1aa; }

    /* Profile Bar with File Upload */
    .profile-bar {
      background: rgba(0, 0, 0, 0.2);
      padding: 8px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .profile-avatar-preview {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #7c3aed;
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .upload-btn-label {
      background: linear-gradient(90deg, #7c3aed 0%, #00d2ff 100%);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-block;
      transition: opacity 0.2s;
    }
    .upload-btn-label:hover { opacity: 0.9; }

    #messages-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 12px 14px;
      position: relative;
    }
    .msg-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #3b82f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      object-fit: cover;
      overflow: hidden;
    }
    .user-name { font-weight: 700; font-size: 13px; color: #38bdf8; }
    .role-badge {
      background: #8b5cf6;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 10px;
      text-transform: uppercase;
    }
    .msg-body { font-size: 14px; color: #f4f4f5; line-height: 1.4; word-break: break-word; }

    .admin-controls {
      margin-left: auto;
      display: flex;
      gap: 6px;
    }
    .admin-btn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .admin-btn:hover { background: rgba(239, 68, 68, 0.35); }

    .chat-footer {
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.4);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msn-toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .msn-toolbar select {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: none;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
    }
    .msn-toolbar input[type="color"] {
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      background: transparent;
    }

    .input-wrapper { display: flex; gap: 8px; align-items: center; }
    .chat-input {
      flex: 1;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .send-btn {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
    }
  </style>
</head>
<body>

<div class="app-container">

  <!-- 1. LOGIN / SIGNUP VIEW -->
  <div id="login-screen">
    <div class="brand-logo">🦊</div>
    <div class="brand-title">Wildstyle Community</div>
    <div class="brand-subtitle">Sign in to chat with DJs and listeners.</div>

    <div class="form-group">
      <label for="auth-user">Username</label>
      <input type="text" id="auth-user" class="form-input" placeholder="e.g. EchoFalls" maxlength="20" />
    </div>

    <div class="form-group">
      <label for="auth-pass">Password</label>
      <input type="password" id="auth-pass" class="form-input" placeholder="Password" />
    </div>

    <button id="submit-btn" class="btn-submit">Login</button>

    <div class="toggle-auth" id="toggle-auth-mode">
      Need an account? <span id="mode-text">Register</span>
    </div>
    <div id="auth-error"></div>
  </div>

  <!-- 2. MAIN CHAT / LOBBY VIEW -->
  <div id="chat-screen">
    <div class="chat-header">
      <div class="header-info">
        <div id="my-header-avatar" class="avatar" style="background: #8b5cf6; cursor: pointer;" onclick="openProfile(loggedInUser, loggedInRole, userAvatarUrl)">🦊</div>
        <div>
          <div class="header-title">Wildstyle Community</div>
          <div class="header-sub">Live Community Chat</div>
        </div>
      </div>
      
      <!-- Status Selector -->
      <div class="status-container" style="display: flex; align-items: center; gap: 8px;">
        <div id="status-dot" style="width: 8px; height: 8px; border-radius: 50%; background: #22c55e;"></div>
        <select id="user-status-select" onchange="updateUserStatus()" style="background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; outline: none; cursor: pointer;">
          <option value="online" style="background: #121324;">🟢 Online</option>
          <option value="brb" style="background: #121324;">🟡 BRB</option>
          <option value="afk" style="background: #121324;">🟠 AFK</option>
          <option value="offline" style="background: #121324;">🔴 Offline</option>
        </select>
      </div>
    </div>

    <!-- Direct File Upload Bar -->
    <div class="profile-bar">
      <div id="profile-preview-box" class="profile-avatar-preview" onclick="document.getElementById('avatar-file-input').click()">?</div>
      
      <input type="file" id="avatar-file-input" accept="image/*" style="display: none;" onchange="uploadAvatar(event)" />
      
      <label for="avatar-file-input" class="upload-btn-label">
        📷 Upload Profile Picture
      </label>
      <span id="upload-status" style="font-size: 11px; color: #a1a1aa;"></span>
    </div>

    <!-- Live Message Cards Stream -->
    <div id="messages-list"></div>

    <!-- MSN Styling Bar & Input -->
    <div class="chat-footer">
      <div class="msn-toolbar">
        <select id="font-family">
          <option value="Segoe UI">Segoe UI</option>
          <option value="Comic Sans MS">Comic Sans</option>
          <option value="Impact">Impact</option>
          <option value="Arial">Arial</option>
        </select>
        <input type="color" id="font-color" value="#38bdf8" />
      </div>

      <div class="input-wrapper">
        <input type="text" id="message-input" class="chat-input" placeholder="Type your message..." maxlength="250" />
        <button id="send-btn" class="send-btn">➤</button>
      </div>
    </div>
  </div>

  <!-- 3. PROFILE MODAL POPUP -->
  <div id="profile-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); align-items:center; justify-content:center; z-index:1000; padding:20px;">
    <div style="background:#1d1838; border:1px solid rgba(255,255,255,0.15); border-radius:20px; padding:24px; width:100%; max-width:300px; text-align:center; position:relative; box-shadow:0 10px 30px rgba(0,0,0,0.5);">
      <button onclick="closeProfileModal()" style="position:absolute; top:12px; right:16px; background:none; border:none; color:#a1a1aa; font-size:18px; cursor:pointer;">✕</button>
      
      <div id="modal-avatar" style="width:72px; height:72px; border-radius:50%; background:#7c3aed; margin:0 auto 12px auto; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:bold; overflow:hidden;">?</div>
      <div id="modal-username" style="font-size:18px; font-weight:700; color:#fff; margin-bottom:4px;">Username</div>
      <div id="modal-role" class="role-badge" style="display:inline-block; margin-bottom:12px;">MEMBER</div>
      
      <div style="background:rgba(255,255,255,0.05); padding:10px; border-radius:12px; font-size:12px; color:#a1a1aa; margin-top:8px;">
        Status: <span id="modal-status" style="color:#4ade80; font-weight:600;">Online</span>
      </div>

      <!-- Admin Role Assignment Tool -->
      <div id="role-assign-box" style="display:none; margin-top:14px; background:rgba(0,0,0,0.3); padding:10px; border-radius:12px; border:1px solid rgba(255,255,255,0.1);">
        <label style="font-size:11px; color:#a1a1aa; display:block; margin-bottom:6px; font-weight:600;">ASSIGN ROLE</label>
        <select id="role-assign-select" style="background:#121324; color:#fff; border:1px solid rgba(255,255,255,0.2); padding:6px 10px; border-radius:8px; font-size:12px; width:100%; font-weight:600; outline:none;" onchange="updateTargetUserRole()">
          <option value="member">Member</option>
          <option value="mod">MOD</option>
          <option value="dj">DJ</option>
          <option value="admin">Admin</option>
          <option value="owner">Owner</option>
        </select>
        <div id="role-save-status" style="font-size:10px; color:#4ade80; margin-top:4px;"></div>
      </div>
    </div>
  </div>

</div>

<script>
  const SUPABASE_URL = "https://ajecuaxfbjmztttgwzzk.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqZWN1YXhmYmptenR0dGd3enprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MzA2NDMsImV4cCI6MjEwMjMwNjY0M30.1_RWdO3gm2PljpYDVGxZPnQWBFrnU7DXjjmnFvij2_0";

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let loggedInUser = "";
  let loggedInRole = "member";
  let userAvatarUrl = "";
  let isSignUpMode = false;
  let presenceChannel = null;
  let currentStatus = "online";
  let lastMessageTime = 0;
  let currentlyViewedUser = "";

  const statusColors = {
    online: "#22c55e",
    brb: "#eab308",
    afk: "#f97316",
    offline: "#ef4444"
  };

  document.getElementById('toggle-auth-mode').onclick = () => {
    isSignUpMode = !isSignUpMode;
    document.getElementById('submit-btn').innerText = isSignUpMode ? "Register" : "Login";
    document.getElementById('mode-text').innerText = isSignUpMode ? "Sign in" : "Register";
  };

  // Auth Handling
  document.getElementById('submit-btn').onclick = async () => {
    const user = document.getElementById('auth-user').value.trim();
    const pass = document.getElementById('auth-pass').value.trim();
    const errDiv = document.getElementById('auth-error');
    errDiv.innerText = "";

    if (!user || !pass) return errDiv.innerText = "Please enter username and password.";

    if (isSignUpMode) {
      const { error } = await db.from('users').insert([{ username: user, password: pass, role: 'member' }]);
      if (error) {
        errDiv.innerText = "Username taken or failed to register.";
      } else {
        errDiv.style.color = "#22c55e";
        errDiv.innerText = "Account created! You can now log in.";
        isSignUpMode = false;
        document.getElementById('submit-btn').innerText = "Login";
        document.getElementById('mode-text').innerText = "Register";
      }
    } else {
      const { data, error } = await db.from('users').select('*').eq('username', user).eq('password', pass);
      
      if (error || !data || data.length === 0) {
        errDiv.style.color = "#ef4444";
        errDiv.innerText = "Invalid credentials.";
      } else if (data[0].is_banned) {
        errDiv.style.color = "#ef4444";
        errDiv.innerText = "This account has been permanently banned.";
      } else {
        loggedInUser = data[0].username;
        loggedInRole = (data[0].role || "member").toLowerCase();
        userAvatarUrl = data[0].avatar_url || "";

        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';

        updateAvatarUI();
        loadMessages();
        subscribeRealtime();
        initPresence();
      }
    }
  };

  // Direct File Upload Logic to Supabase Storage
  async function uploadAvatar(event) {
    const file = event.target.files[0];
    if (!file) return;

    const statusLabel = document.getElementById('upload-status');
    statusLabel.innerText = "Uploading...";

    const fileExt = file.name.split('.').pop();
    const filePath = `${loggedInUser}_${Date.now()}.${fileExt}`;

    const { error: uploadErr } = await db.storage.from('avatars').upload(filePath, file, { upsert: true });

    if (uploadErr) {
      statusLabel.innerText = "";
      alert("Error uploading image: " + uploadErr.message);
      return;
    }

    const { data: publicUrlData } = db.storage.from('avatars').getPublicUrl(filePath);
    const newAvatarUrl = publicUrlData.publicUrl;

    const { error: dbErr } = await db.from('users').update({ avatar_url: newAvatarUrl }).eq('username', loggedInUser);

    if (dbErr) {
      statusLabel.innerText = "";
      alert("Failed to save image link: " + dbErr.message);
    } else {
      userAvatarUrl = newAvatarUrl;
      updateAvatarUI();
      statusLabel.innerText = "Saved!";
      setTimeout(() => statusLabel.innerText = "", 3000);
    }
  }

  function updateAvatarUI() {
    const preview = document.getElementById('profile-preview-box');
    const headerAvatar = document.getElementById('my-header-avatar');

    if (userAvatarUrl) {
      preview.innerHTML = `<img src="${userAvatarUrl}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;" />`;
      headerAvatar.innerHTML = `<img src="${userAvatarUrl}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;" />`;
    } else {
      const initial = loggedInUser.charAt(0).toUpperCase();
      preview.innerText = initial;
      headerAvatar.innerText = initial;
    }
  }

  // Open Profile Modal & Show Admin Role Control Option
  async function openProfile(username, defaultRole, avatarUrl) {
    currentlyViewedUser = username;
    const modal = document.getElementById('profile-modal');
    const modalUser = document.getElementById('modal-username');
    const modalRole = document.getElementById('modal-role');
    const modalAvatar = document.getElementById('modal-avatar');
    const roleBox = document.getElementById('role-assign-box');
    const roleSelect = document.getElementById('role-assign-select');
    document.getElementById('role-save-status').innerText = "";

    modalUser.innerText = username;
    let targetRole = (defaultRole || 'member').toLowerCase();
    modalRole.innerText = targetRole.toUpperCase();

    let badgeColor = "#6b7280"; 
    if (targetRole === 'owner') badgeColor = "#ef4444";      
    else if (targetRole === 'admin') badgeColor = "#dc2626"; 
    else if (targetRole === 'dj') badgeColor = "#ec4899";    
    else if (targetRole === 'mod') badgeColor = "#eab308";   
    modalRole.style.background = badgeColor;

    if (avatarUrl) {
      modalAvatar.innerHTML = `<img src="${DOMPurify.sanitize(avatarUrl)}" style="width:100%; height:100%; object-fit:cover;" />`;
    } else {
      modalAvatar.innerHTML = username.charAt(0).toUpperCase();
    }

    // Fetch latest user details from Database
    const { data } = await db.from('users').select('avatar_url, role').eq('username', username).single();
    if (data) {
      if (data.avatar_url) {
        modalAvatar.innerHTML = `<img src="${DOMPurify.sanitize(data.avatar_url)}" style="width:100%; height:100%; object-fit:cover;" />`;
      }
      if (data.role) {
        targetRole = data.role.toLowerCase();
        modalRole.innerText = targetRole.toUpperCase();
      }
    }

    // Show Role Dropdown ONLY for Admin & Owner
    const isOwnerOrAdmin = ['admin', 'owner'].includes(loggedInRole);
    if (isOwnerOrAdmin) {
      roleBox.style.display = 'block';
      roleSelect.value = targetRole;
    } else {
      roleBox.style.display = 'none';
    }

    modal.style.display = 'flex';
  }

  // Update Selected User's Role in Supabase
  async function updateTargetUserRole() {
    if (!currentlyViewedUser) return;
    const newRole = document.getElementById('role-assign-select').value;
    const statusLabel = document.getElementById('role-save-status');

    statusLabel.style.color = "#a1a1aa";
    statusLabel.innerText = "Updating...";

    const { error } = await db.from('users').update({ role: newRole }).eq('username', currentlyViewedUser);

    if (error) {
      statusLabel.style.color = "#ef4444";
      statusLabel.innerText = "Error: " + error.message;
    } else {
      statusLabel.style.color = "#4ade80";
      statusLabel.innerText = "Role updated successfully!";
      
      const modalRole = document.getElementById('modal-role');
      modalRole.innerText = newRole.toUpperCase();
      
      let badgeColor = "#6b7280"; 
      if (newRole === 'owner') badgeColor = "#ef4444";      
      else if (newRole === 'admin') badgeColor = "#dc2626"; 
      else if (newRole === 'dj') badgeColor = "#ec4899";    
      else if (newRole === 'mod') badgeColor = "#eab308";   
      modalRole.style.background = badgeColor;

      loadMessages();
    }
  }

  function closeProfileModal() {
    document.getElementById('profile-modal').style.display = 'none';
  }

  // Load Past Messages
  async function loadMessages() {
    document.getElementById('messages-list').innerHTML = '';
    const { data } = await db.from('messages').select('*').order('id', { ascending: true }).limit(50);
    if (data) data.forEach(msg => renderCard(msg));
  }

  // Live Realtime Subscription
  function subscribeRealtime() {
    db.channel('custom-all-channel')
      .on(
        'postgres_changes',
        { event: '*', schema: 'public', table: 'messages' },
        (payload) => {
          if (payload.eventType === 'INSERT') {
            renderCard(payload.new);
          } else if (payload.eventType === 'DELETE') {
            loadMessages();
          }
        }
      )
      .subscribe();
  }

  // Presence Tracking
  function initPresence() {
    presenceChannel = db.channel('online-users', {
      config: { presence: { key: loggedInUser } },
    });

    presenceChannel
      .on('presence', { event: 'sync' }, () => {
        const state = presenceChannel.presenceState();
        console.log("Online Users:", state);
      })
      .subscribe(async (status) => {
        if (status === 'SUBSCRIBED') {
          await presenceChannel.track({
            user: loggedInUser,
            role: loggedInRole,
            avatar: userAvatarUrl,
            status: currentStatus,
            online_at: new Date().toISOString()
          });
        }
      });
  }

  async function updateUserStatus() {
    const select = document.getElementById('user-status-select');
    currentStatus = select.value;

    const dot = document.getElementById('status-dot');
    if (dot) dot.style.background = statusColors[currentStatus] || "#22c55e";

    if (presenceChannel) {
      await presenceChannel.track({
        user: loggedInUser,
        role: loggedInRole,
        avatar: userAvatarUrl,
        status: currentStatus,
        online_at: new Date().toISOString()
      });
    }
  }

  // Render Card with User Profile & Deletion Controls
  function renderCard(msg) {
    const list = document.getElementById('messages-list');
    if (!list) return;

    if (msg.id && document.getElementById(`msg-${msg.id}`)) return;

    const cleanUser = DOMPurify.sanitize(msg.username || "Guest");
    const msgRole = (msg.role || "member").toLowerCase();

    const cleanBody = DOMPurify.sanitize(msg.formatted_text || "", {
      ALLOWED_TAGS: ['span', 'b', 'i', 'u', 'font'],
      ALLOWED_ATTR: ['style', 'color']
    });

    let badgeColor = "#6b7280"; 
    if (msgRole === 'owner') badgeColor = "#ef4444";      
    else if (msgRole === 'admin') badgeColor = "#dc2626"; 
    else if (msgRole === 'dj') badgeColor = "#ec4899";    
    else if (msgRole === 'mod') badgeColor = "#eab308";   

    const canDelete = ['admin', 'mod', 'owner'].includes(loggedInRole);
    const deleteControlsHtml = (canDelete && msg.id)
      ? `<div class="admin-controls">
           <button class="admin-btn" onclick="deleteMessage(${msg.id})">🗑 Msg</button>
           <button class="admin-btn" onclick="deleteAllUserMessages('${cleanUser}')">🗑 All</button>
         </div>`
      : '';

    const avatarHtml = msg.avatar_url 
      ? `<img src="${DOMPurify.sanitize(msg.avatar_url)}" class="avatar" style="object-fit:cover;" />` 
      : `<div class="avatar">${cleanUser.charAt(0).toUpperCase()}</div>`;

    const card = document.createElement('div');
    card.className = 'msg-card';
    if (msg.id) card.id = `msg-${msg.id}`;
    
    card.innerHTML = `
      <div class="msg-header">
        <div onclick="openProfile('${cleanUser}', '${msgRole}', '${msg.avatar_url || ''}')" style="cursor:pointer;">
          ${avatarHtml}
        </div>
        <div class="user-name" onclick="openProfile('${cleanUser}', '${msgRole}', '${msg.avatar_url || ''}')" style="cursor:pointer;">
          ${cleanUser}
        </div>
        <div class="role-badge" style="background: ${badgeColor};">${msgRole.toUpperCase()}</div>
        ${deleteControlsHtml}
      </div>
      <div class="msg-body" style="margin-top:6px;">${cleanBody}</div>
    `;

    list.appendChild(card);
    list.scrollTop = list.scrollHeight;
  }

  // Delete Single Message
  async function deleteMessage(msgId) {
    if (!confirm("Delete this single message?")) return;
    const { error } = await db.from('messages').delete().eq('id', msgId);
    if (error) alert("Failed to delete message: " + error.message);
  }

  // Delete ALL Messages From Target User
  async function deleteAllUserMessages(targetUsername) {
    if (!confirm(`Are you sure you want to delete ALL messages sent by ${targetUsername}?`)) return;

    const { error } = await db.from('messages').delete().eq('username', targetUsername);

    if (error) {
      alert("Failed to delete user messages: " + error.message);
    } else {
      loadMessages();
    }
  }

  // Send Message with Anti-Spam
  async function sendMessage() {
    const now = Date.now();
    if (now - lastMessageTime < 1500) {
      alert("Slow down! Please wait 1.5 seconds between messages.");
      return;
    }

    const input = document.getElementById('message-input');
    const text = input.value.trim();
    if (!text || !loggedInUser) return;

    lastMessageTime = now;

    const font = document.getElementById('font-family').value;
    const color = document.getElementById('font-color').value;
    const payload = `<span style="font-family: '${font}'; color: ${color};">${text}</span>`;

    input.value = '';

    const { data, error } = await db
      .from('messages')
      .insert([{ username: loggedInUser, role: loggedInRole, avatar_url: userAvatarUrl, formatted_text: payload }])
      .select();

    if (error) {
      console.error("Supabase Error:", error);
      alert("Error sending message: " + error.message);
    } else if (data && data[0]) {
      renderCard(data[0]);
    }
  }

  document.getElementById('send-btn').onclick = sendMessage;
  document.getElementById('message-input').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });
</script>

</body>
