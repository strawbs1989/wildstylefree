<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Wildstyle Community | Forgot Password</title>

    <link
        rel="stylesheet"
        href="css/community.css">

    <script
        src="https://unpkg.com/@supabase/supabase-js@2">
    </script>

</head>

<body>

<div class="background"></div>

<div class="login-container">

    <div class="logo-area">

        <img
            src="/Chat/Images/icon.png"
            alt="Wildstyle Radio Logo"
            class="logo">

        <h1>Forgot Password?</h1>

        <p>
            Enter your email address and we'll send you
            a link to reset your password.
        </p>

    </div>


    <form id="forgotForm">

        <div class="input-group">

            <label>Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="you@example.com"
                required>

        </div>


        <button
            type="submit"
            class="login-btn">

            Send Reset Link

        </button>

    </form>


    <div
        id="message"
        class="message">
    </div>


    <div class="bottom-links">

        <a href="index.html">
            ← Back to Login
        </a>

    </div>

</div>


<script src="js/supabase.js"></script>
<script src="js/forgot.js"></script>

</body>
</html>
