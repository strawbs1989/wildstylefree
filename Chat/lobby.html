<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fake Chat</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #111827;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-wrapper {
      width: 360px;
      max-width: 95vw;
      background: #1f2937;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 12px 16px;
      background: #111827;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      background: linear-gradient(135deg, #f97316, #22c55e, #3b82f6);
    }

    .chat-header-info {
      display: flex;
      flex-direction: column;
    }

    .chat-header-title {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .chat-header-status {
      font-size: 0.75rem;
      color: #9ca3af;
    }

    .chat-messages {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      background: radial-gradient(circle at top left, #111827, #020617);
    }

    .msg {
      max-width: 80%;
      padding: 8px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .msg.me {
      align-self: flex-end;
      background: #3b82f6;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .msg.bot {
      align-self: flex-start;
      background: #374151;
      border-bottom-left-radius: 4px;
    }

    .timestamp {
      font-size: 0.7rem;
      color: #6b7280;
      margin-top: 2px;
    }

    .chat-input {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #111827;
      border-top: 1px solid #1f2937;
    }

    .chat-input input {
      flex: 1;
      padding: 8px 10px;
      border-radius: 999px;
      border: none;
      outline: none;
      font-size: 0.85rem;
      background: #1f2937;
      color: #e5e7eb;
    }

    .chat-input button {
      padding: 8px 14px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      background: #22c55e;
      color: #022c22;
    }

    .chat-input button:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div class="chat-wrapper">
    <div class="chat-header">
      <div class="avatar"></div>
      <div class="chat-header-info">
        <div class="chat-header-title">FakeChat Bot</div>
        <div class="chat-header-status">Online · pretending to be busy</div>
      </div>
    </div>

    <div class="chat-messages" id="chat">
      <div class="msg bot">
        Hey! I’m a totally fake chat bot. Type anything below and I’ll respond.
        <div class="timestamp">just now</div>
      </div>
    </div>

    <div class="chat-input">
      <input id="input" type="text" placeholder="Type a message…" />
      <button id="send">Send</button>
    </div>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    const fakeReplies = [
      "Love that. Totally noted in my imaginary database.",
      "Interesting… if I were real, I’d have so many thoughts.",
      "Let’s pretend I just solved all your problems.",
      "That message has been forwarded to the Department of Vibes.",
      "You’re chatting to a fake site, but the energy is real."
    ];

    function addMessage(text, who = 'me') {
      const msg = document.createElement('div');
      msg.className = `msg ${who}`;
      msg.innerHTML = text + `<div class="timestamp">${new Date().toLocaleTimeString()}</div>`;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    function replyFake() {
      const reply =
        fakeReplies[Math.floor(Math.random() * fakeReplies.length)];
      setTimeout(() => addMessage(reply, 'bot'), 600);
    }

    sendBtn.addEventListener('click', () => {
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, 'me');
      input.value = '';
      replyFake();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendBtn.click();
    });
  </script>
</body>
</html>
