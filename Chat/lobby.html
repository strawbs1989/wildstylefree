<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wildstyle Community Chat</title>

<link rel="stylesheet" href="css/community.css">

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

</head>
<body>

<div class="background"></div>

<div class="chat-container">

    <header class="chat-header">

        <div class="header-left">

            <img src="../images/logo.png" class="logo" alt="Wildstyle Radio">

            <div>

                <h1>Wildstyle Community</h1>

                <p>Live Community Chat</p>

            </div>

        </div>
        
        <button id="logoutBtn" class="logout-btn">
            Logout
        </button>
        <button
    id="profileBtn"
    class="profile-btn"
    onclick="window.location.href='profile.html'">

    👤 Profile

</button>

<!-- MSN STYLE STATUS -->

<div class="status-control">

    <button
        id="statusButton"
        class="status-button">

        🟢 Online
    </button>

    <div
        id="statusMenu"
        class="status-menu">

        <button data-status="Online">
            🟢 Online
        </button>

        <button data-status="Away">
            🟡 Away
        </button>

        <button data-status="Busy">
            🔴 Busy
        </button>

        <button data-status="Be Right Back">
            🟠 Be Right Back
        </button>

        <button data-status="Invisible">
            ⚫ Invisible
        </button>

    </div>

</div>

    </header>

    <main class="chat-main">

        <aside class="online-users">

            <h3>Online</h3>

            <div id="usersList">

                <div class="user">
                    🟢 You
                </div>

            </div>

        </aside>

        <section class="chat-panel">

            <div id="messages" class="messages">

                <div class="system-message">
                    👋 Welcome to the Wildstyle Community!
                </div>

            </div>
            <div id="typingIndicator" class="typing-indicator"></div>
            <div class="message-box">

    <button id="emojiBtn" class="emoji-btn">
        😊
    </button>

    <input
        type="text"
        id="messageInput"
        placeholder="Type your message...">

    <button id="sendBtn">
        Send
    </button>

</div>

<div id="emojiPicker" class="emoji-picker">

    😀 😁 😂 🤣 😊 😍 😎 🤩 🥳 😢 😡 👍 👎 👏 🙌 ❤️ 💙 💜 🔥 🎵 🎧 🎙️ 📻 🚀

</div>
        </section>

    </main>

</div>
<div id="ownerOverlay" class="owner-overlay"></div>

<!-- OWNER CONTROL PANEL -->

<div id="ownerPanel" class="owner-panel hidden">

    <div class="owner-header">

        <h2>👑 Owner Panel</h2>

        <button id="closeOwnerPanel">✖</button>

    </div>

    <div class="owner-profile">

        <img
            id="ownerAvatar"
            src="/images/default-avatar.png"
            class="owner-avatar">

        <h3 id="ownerName">
            Select a user
        </h3>

        <p id="ownerRole">
            -
        </p>

        <p id="ownerStatus">
            -
        </p>

    </div>

    <hr>

    <div class="owner-actions">

        <button id="btnMakeDJ">🎧 Make DJ</button>

<button id="mobilePrivateMessageBtn" class="private-message-btn"
    type="button"
>
    💬 Private Message
    </button>

        <button id="btnMakeAdmin">🛡️ Make Admin</button>

        <button id="btnMakeVIP">⭐ Make VIP</button>

        <button id="btnMember">👤 Make Member</button>

        <hr>

        <button id="btnMute">🔇 Mute</button>

        <button id="btnKick">👢 Kick</button>

        <button id="btnBan">🚫 Ban</button>

        <button id="btnDeleteMessages">🗑 Delete Messages</button>

    </div>

</div>
<!-- ==========================================
     MOBILE MSN-STYLE PROFILE CARD
========================================== -->

<div id="mobileProfileOverlay" class="mobile-profile-overlay"></div>

<div id="mobileProfileCard" class="mobile-profile-card">


    <button
        id="mobileProfileClose"
        class="mobile-profile-close">
        ✕
    </button>

    

    <img
        id="mobileProfileAvatar"
        src="/images/default-avatar.png"
        class="mobile-profile-avatar"
        alt="User avatar">

    <h2 id="mobileProfileName">
        User
    </h2>

    <div id="mobileProfileStatus" class="mobile-profile-status">
        🟢 Online
    </div>

    <div id="mobileProfileRole" class="mobile-profile-role">
        👤 Member
    </div>
    
    
    <button
        class="mobile-profile-button"
        onclick="mobileViewProfile()">
        👤 View Profile
    </button>

    <!-- OWNER / ADMIN TOOLS -->

    <div
        id="mobileModerationTools"
        class="mobile-moderation-tools">

        <div class="mobile-tools-title">
            👑 Owner Tools
        </div>

        <button
            class="mobile-profile-button"
            onclick="setRole('dj')">
            🎧 Make DJ
        </button>
        
        


        <button
            class="mobile-profile-button"
            onclick="setRole('admin')">
            🛡️ Make Admin
        </button>

        <button
            class="mobile-profile-button"
            onclick="setRole('vip')">
            ⭐ Make VIP
        </button>

        <button
            class="mobile-profile-button"
            onclick="setRole('member')">
            👤 Make Member
        </button>

        <button
            class="mobile-profile-button mobile-ban-button"
            onclick="banUser()">
            🚫 Ban
        </button>

        <button
            class="mobile-profile-button mobile-delete-button"
            onclick="deleteAllMessages()">
            🗑️ Delete Messages
        </button>

    </div>

</div>


<!-- ==========================================
     PRIVATE MESSAGE WINDOW
========================================== -->

<div id="privateChatOverlay" class="private-chat-overlay">

    <div id="privateChatWindow" class="private-chat-window">

        <div class="private-chat-header">

            <div class="private-chat-user">

                <img
                    id="privateChatAvatar"
                    src="/images/default-avatar.png"
                    alt="">

                <div>
                    <strong id="privateChatName">
                        Private Message
                    </strong>

                    <small>
                        🔒 Private conversation
                    </small>
                </div>

            </div>

            <button
                id="privateChatClose"
                type="button">
                ✕
            </button>

        </div>


        <div
            id="privateChatMessages"
            class="private-chat-messages">

            <div class="private-chat-loading">
                Loading conversation...
            </div>

        </div>


        <div class="private-chat-input-area">

            <input
                type="text"
                id="privateChatInput"
                placeholder="Type a private message..."
                autocomplete="off">

            <button
                id="privateChatSend"
                type="button">
                ➤
            </button>

        </div>

    </div>

</div>
    
<script src="js/supabase.js?v=3"></script>
<script src="js/auth.js?v=3"></script>
<script src="js/chat.js?v=4"></script>

<script>
window.onerror = function(message, source, line, col, error) {
    alert(
        "ERROR\n\n" +
        message +
        "\n\nFile:\n" + source +
        "\n\nLine: " + line
    );
};

window.onunhandledrejection = function(event) {
    alert(
        "PROMISE ERROR\n\n" +
        event.reason +
        "\n\n" +
        (event.reason?.stack || "")
    );
};
</script>

<script>
document
.getElementById("messageInput")
.addEventListener("keypress", function(e){

    if(e.key==="Enter"){

        document
        .getElementById("sendBtn")
        .click();

    }

});
</script>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>
eruda.init();
</script>
</body>
</html>
