<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Wildstyle Community | Reset Password
    </title>

    <link
        rel="stylesheet"
        href="css/community.css">

    <script
        src="https://unpkg.com/@supabase/supabase-js@2">
    </script>

</head>


<body>

<div class="background"></div>


<div class="login-container">

    <div class="logo-area">

        <img
            src="/Chat/Images/icon.png"
            alt="Wildstyle Radio Logo"
            class="logo">

        <h1>Reset Password</h1>

        <p>
            Enter your new password below.
        </p>

    </div>


    <form id="resetForm">

        <div class="input-group">

            <label>New Password</label>

            <input
                type="password"
                id="password"
                placeholder="New password"
                minlength="6"
                required>

        </div>


        <div class="input-group">

            <label>Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                minlength="6"
                required>

        </div>


        <button
            type="submit"
            class="login-btn">

            Change Password

        </button>

    </form>


    <div
        id="message"
        class="message">
    </div>

</div>


<script src="js/supabase.js"></script>
<script src="js/reset-password.js"></script>

</body>

</html>
